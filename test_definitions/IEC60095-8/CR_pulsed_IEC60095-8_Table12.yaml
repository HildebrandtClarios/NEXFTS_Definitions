nexfts_schema_version: "0.1.1"

metadata:
  name: "CR_pulsed_72h"
  version: "1.0.0"
  description: "Charge Recovery (CR) Test with pulsed 72h discharge phase according to IEC 60095-8 Table 12"
  standard:
    name: "IEC 60095-8"
    title: "Lead-acid starter batteries - Part 8: Batteries for micro-cycle applications"
    date: "2025-01"
    clause: "Table 12"

global_values:
  Cn:
    value: 60
    unit: "Ah"
    description: "Nominal capacity"
  In:
    value: 3
    unit: "A"
    description: "Nominal 20 hour discharge current (Cn / 20h)"

global_limits:
  max_voltage:
    value: 16.5
    unit: "V"
  max_current:
    value: 500
    unit: "A"
  max_temperature:
    value: 60
    unit: "degC"

steps:
  # Step 01 – Initial discharge part 1: discharge by 38% Cn at 25°C
  - id: 1
    type: discharge
    temperature:
      value: 25
      unit: "degC"
      medium: "air"
    current:
      value: "In"
      unit: "A"
    duration:
      value: 7.6
      unit: "h"
    comment: "Initial discharge part 1 (establish partial SOC) – discharge by 38% Cn at nominal conditions"
    result:
      - name: "Q_DCH_01"
        description: "Discharged capacity in step 01"

  # Step 02 – Rest before cooling
  - id: 2
    type: rest
    temperature:
      value: 25
      unit: "degC"
      medium: "air"
    duration:
      value: 12
      unit: "h"
    comment: "Rest before cooling – min. 12 h, max. 48 h"

  # Step 03 – SET -18°C – command climate chamber to cool down
  - id: 3
    type: set
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    wait: false
    comment: "Command climate chamber to cool to -18°C; soak follows in next step"

  # Step 04 – Soak to test temperature -18°C
  - id: 4
    type: rest
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    duration:
      value: 20
      unit: "h"
    comment: "Soak to test temperature – min. 20 h, max. 36 h"

  # Step 05 – Begin loop: repeat steps 06–07 for 4320 times (60 × 72 loops)
  - id: 5
    type: begin
    level: 1
    comment: "Begin loop – repeat steps 06–07 for 60 × 72 = 4320 times (pulsed 72 h discharge)"

  # Step 06 – Pulsed discharge: 6 s at 0.33·In (10-fold current for 1/10 of a minute)
  - id: 6
    type: discharge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    current:
      value: "0.33 * In"
      unit: "A"
    duration:
      value: 6
      unit: "s"
    comment: "Initial discharge part 2 – 10 fold current for 1/10 of a minute – discharge by 12% Cn at winter condition"
    result:
      - name: "Q_DCH_06"
        description: "Charge balance of step 06"

  # Step 07 – Pause: 54 s rest
  - id: 7
    type: rest
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    duration:
      value: 54
      unit: "s"
    comment: "Initial discharge part 2 – rest for 9/10 of a minute"

  # Step 08 – End loop (cycle): return to begin until count reached
  - id: 8
    type: cycle
    level: 1
    count: 4320
    comment: "End loop – return to begin (step 05) until 4320 repetitions completed"

  # Step 09 – PAU 1 min – OCV measurement
  - id: 9
    type: rest
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    duration:
      value: 1
      unit: "min"
    comment: "Rest before SOF performance test"
    result:
      - name: "U_OC"
        description: "Open circuit voltage after 1 min rest"

  # Step 09 – DCH 10 s – SOF performance test before charge
  - id: 10
    type: discharge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 10
      unit: "s"
    comment: "SOF performance test before charge"
    result:
      - name: "U_10s_0"
        description: "Voltage after 10 s discharge and 0 min total preceding charge time"
        at:
          value: 10
          unit: "s"
      - name: "Q_09"
        description: "Charge balance of step 10"

  # Step 10 – CHA 1 min at 15.0 V / 20·In – charge test: 1' total
  - id: 11
    type: charge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    voltage:
      value: 15.0
      unit: "V"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 1
      unit: "min"
    comment: "Charge test: 1' total"
    result:
      - name: "Q_1min"
        description: "Charge balance of steps 09–10"

  # Step 11 – DCH 10 s – SOF after 1 min
  - id: 12
    type: discharge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 10
      unit: "s"
    comment: "SOF performance test after 1 min."
    result:
      - name: "U_10s_1min"
        description: "Voltage after 10 s discharge and 1 min total preceding charge time"
        at:
          value: 10
          unit: "s"

  # Step 12 – CHA 9 min at 15.0 V / 20·In – charge test: 10' total
  - id: 13
    type: charge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    voltage:
      value: 15.0
      unit: "V"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 9
      unit: "min"
    comment: "Charge test: 10' total"
    result:
      - name: "Q_10min"
        description: "Charge balance of steps 09–12"

  # Step 13 – DCH 10 s – SOF after 10 min
  - id: 14
    type: discharge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 10
      unit: "s"
    comment: "SOF performance test after 10 min."
    result:
      - name: "U_10s_10min"
        description: "Voltage after 10 s discharge and 10 min total preceding charge time"
        at:
          value: 10
          unit: "s"

  # Step 14 – CHA 20 min at 15.0 V / 20·In – charge test: 30' total
  - id: 15
    type: charge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    voltage:
      value: 15.0
      unit: "V"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 20
      unit: "min"
    comment: "Charge test: 30' total"
    result:
      - name: "Q_30min"
        description: "Charge balance of steps 09–14"

  # Step 15 – DCH 10 s – SOF after 30 min
  - id: 16
    type: discharge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 10
      unit: "s"
    comment: "SOF performance test after 30 min."
    result:
      - name: "U_10s_30min"
        description: "Voltage after 10 s discharge and 30 min total preceding charge time"
        at:
          value: 10
          unit: "s"

  # Step 16 – CHA 90 min at 15.0 V / 20·In – charge test: 2h total
  - id: 17
    type: charge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    voltage:
      value: 15.0
      unit: "V"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 90
      unit: "min"
    comment: "Charge test: 2 h total"
    result:
      - name: "Q_120min"
        description: "Charge balance of steps 09–16"

  # Step 17 – DCH 120 s – SOF after 2 h
  - id: 18
    type: discharge
    temperature:
      value: -18
      unit: "degC"
      medium: "air"
    current:
      value: "20 * In"
      unit: "A"
    duration:
      value: 120
      unit: "s"
    comment: "SOF performance test after 2 hours"
    result:
      - name: "U_10s_120min"
        description: "Voltage after 10 s discharge and 120 min total preceding charge time"
        at:
          value: 10
          unit: "s"
      - name: "U_120s_120min"
        description: "Voltage after 120 s discharge and 120 min total preceding charge time"
        at:
          value: 120
          unit: "s"

